<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="林静闻的作品合集 · Jingwen Lin’s Portfolio。浏览画作与创作作品。">
<meta name="theme-color" content="#ffffff">
<title>林静闻的作品合集 · Jingwen Lin’s Portfolio</title>
<style>
:root{--paper:#ffffff;--ink:#000000;--muted:#666666;--accent:#000000;--line:#eeeeee}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.7}
a{color:inherit;text-underline-offset:5px}button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
.skip{position:fixed;top:-100px;left:16px;background:white;padding:12px;z-index:10}.skip:focus{top:12px}
.wrap{width:min(1120px,calc(100% - 64px));margin-inline:auto}
nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:700;text-decoration:none;letter-spacing:.12em}
.nav-links{display:flex;gap:28px}.nav-links a{text-decoration:none;font-size:14px}.nav-links a:hover{color:var(--accent)}



.cta{display:inline-block;padding:12px 24px;background:var(--ink);color:white;text-decoration:none;border:1px solid var(--ink)}


section{scroll-margin-top:24px}.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:26px 0;border-top:1px solid var(--line)}
h2{font-size:28px;font-weight:500;margin:0}.hint{color:var(--muted);font-size:14px;margin:0}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-bottom:80px}
.work{margin:0;min-width:0}.art-link{display:block;background:#fff;padding:16px;transition:background .2s}
.art-link:hover{background:#eee7e3}.work img{display:block;width:100%;aspect-ratio:4/5;object-fit:contain}
.work figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:15px;font-size:15px}.year{color:var(--muted);font-size:13px}
.contact{padding:36px 0 64px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:32px;align-items:center}
.contact p{margin:12px 0 0;color:var(--muted)}.contact-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.copy{padding:12px 20px;border:1px solid var(--line);background:transparent}.copy:hover{border-color:var(--accent)}
.status{font-size:13px;min-height:1.7em;color:var(--accent)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
dialog{border:0;padding:60px 24px 24px;background:var(--paper);color:var(--ink);width:min(1000px,94vw);max-height:94vh}
dialog::backdrop{background:rgba(25,18,16,.8)}dialog img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;margin:auto;object-fit:contain}
.close{position:absolute;right:16px;top:12px;border:1px solid var(--line);background:white;padding:6px 14px}
.dialog-caption{text-align:center;margin:16px 0 0;color:var(--muted)}

@media(max-width:760px){.wrap{width:calc(100% - 36px)}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px;padding-bottom:48px}.contact{align-items:flex-start;flex-direction:column;gap:24px}}
/* Keep the eyes at the exact center of the first viewport. */
header.wrap{position:relative}
nav{position:absolute;top:0;left:0;right:0;border:0;z-index:1}
.hero{position:relative;display:block;height:100svh;min-height:480px;padding:0}
.eyes{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(var(--look-tilt,0deg));display:flex;gap:34px;pointer-events:none;transition:transform 140ms ease-out}
.eye{position:relative;display:block;width:64px;height:74px}
.pupil{position:absolute;left:11px;top:10px;width:42px;height:54px;transition:transform 100ms ease-out}
.pupil::before{content:"";position:absolute;left:0;top:0;width:100%;height:100%;background:#000;border-radius:50%;transform-origin:center}
.eyes.squinting .pupil::before{top:calc(50% - 4px);height:8px;border-radius:999px}
.eyes.angry .pupil::before{clip-path:inset(50% 0 0 0);transform:translateY(-13.5px) rotate(12deg)}
.eyes.angry .eye:last-child .pupil::before{transform:translateY(-13.5px) rotate(-12deg)}
.eyes.blinking .pupil::before{animation:blink 240ms ease-in-out}
@keyframes blink{0%,100%{transform:scaleY(1)}40%,60%{transform:scaleY(.055)}}
.hero-copy{position:absolute;top:calc(50% + 120px);left:0;right:0;text-align:center}
.hero h1{font-size:clamp(24px,4.2vw,40px);font-weight:500;line-height:1.4;letter-spacing:.08em;margin:0}
.english{font-size:clamp(12px,1.8vw,15px);color:#666;margin:12px 0 0;letter-spacing:.04em}
.browse{display:inline-flex;align-items:center;gap:12px;margin-top:34px;font-size:13px;text-decoration:none;padding:8px 12px}
.browse:hover{text-decoration:underline}
.art-link:hover{background:#f5f5f5}
@media(max-width:520px){nav{padding:18px 0}.nav-links{gap:18px}.hero-copy{top:calc(50% + 100px)}.hero h1{font-size:26px;letter-spacing:.04em}.eyes{gap:24px}.gallery{grid-template-columns:1fr}.work img{aspect-ratio:auto;max-height:520px}.art-link{padding:12px}.section-heading{align-items:flex-start;flex-direction:column;gap:4px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}.eyes.blinking .pupil::before{animation:none}}
</style>
</head>
<body>
<a class="skip" href="#works">跳到作品</a>
<header class="wrap">
<nav aria-label="主导航"><a class="brand" href="#">林静闻</a><div class="nav-links"><a href="#works">作品</a><a href="#contact">联系</a></div></nav>
<div class="hero">
  <div class="eyes" id="eyes" aria-hidden="true">
    <span class="eye"><span class="pupil"></span></span>
    <span class="eye"><span class="pupil"></span></span>
  </div>

    <h1>林静闻的作品合集</h1>

<main class="wrap">
<section id="works" aria-labelledby="works-title">
<div class="section-heading"><h2 id="works-title">作品集</h2><p class="hint">点击画作，查看完整大图</p></div>
<div class="gallery">
<figure class="work"><a class="art-link" href="3f48880e3edd73ae4baf8ad29bb51d16.jpg" data-title="作品1 · 2025" aria-label="放大查看作品1"><img src="3f48880e3edd73ae4baf8ad29bb51d16.jpg" alt="作品1" loading="lazy" decoding="async"></a><figcaption><span>作品1</span><span class="year">2025</span></figcaption></figure>
<figure class="work"><a class="art-link" href="eb8fa704f4ba858b381abc25a9b1e10e.jpg" data-title="作品2 · 2025" aria-label="放大查看作品2"><img src="eb8fa704f4ba858b381abc25a9b1e10e.jpg" alt="作品2" loading="lazy" decoding="async"></a><figcaption><span>作品2</span><span class="year">2025</span></figcaption></figure>
<figure class="work"><a class="art-link" href="f118cb28e396485c23c221a8b37be1fe.jpg" data-title="作品3 · 2025" aria-label="放大查看作品3"><img src="f118cb28e396485c23c221a8b37be1fe.jpg" alt="作品3" loading="lazy" decoding="async"></a><figcaption><span>作品3</span><span class="year">2025</span></figcaption></figure>
</div>

<section id="contact" class="contact" aria-labelledby="contact-title">
<div><h2 id="contact-title">联系我</h2><p>关于画作的交流与合作，欢迎通过微信联系。</p></div>
<div class="contact-actions"><span>微信：<span id="wechat">15336513023</span></span><button class="copy" id="copy-wechat" type="button" hidden>复制微信号</button><span class="status" id="copy-status" role="status"></span></div>
</section>
</main>
<footer><div class="wrap">© 2026 林静闻的作品合集</div></footer>
<dialog id="viewer" aria-label="作品大图" aria-describedby="viewer-caption"><button class="close" type="button" aria-label="关闭作品大图">关闭</button><img id="viewer-image" alt=""><p class="dialog-caption" id="viewer-caption"></p></dialog>
<script>
const viewer=document.getElementById('viewer');
const image=document.getElementById('viewer-image');
const caption=document.getElementById('viewer-caption');
if(typeof viewer.showModal==='function'){
document.querySelectorAll('.art-link').forEach(link=>link.addEventListener('click',event=>{
if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
event.preventDefault();
image.src=link.getAttribute('href');
image.alt=link.querySelector('img').alt;
caption.textContent=link.dataset.title;
viewer.showModal();
}));
viewer.querySelector('.close').addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',event=>{if(event.target===viewer){const r=viewer.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)viewer.close();}});
viewer.addEventListener('close',()=>image.removeAttribute('src'));
}
const copyButton=document.getElementById('copy-wechat');
copyButton.hidden=false;
copyButton.addEventListener('click',async()=>{
const status=document.getElementById('copy-status');
try{await navigator.clipboard.writeText(document.getElementById('wechat').textContent);status.textContent='已复制，可以到微信添加。';}
catch{status.textContent='未能自动复制，请长按或选中上方微信号复制。';}
});




// Gaze and blinking use separate layers so a blink never resets the gaze.
(()=>{
const eyes=document.getElementById('eyes');
const pupils=[...eyes.querySelectorAll('.pupil')];
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let pointer=null,frame=0,blinkTimer=0,openTimer=0,focused=true;
function visible(){const r=eyes.getBoundingClientRect();return r.bottom>0&&r.top<innerHeight;}
function reset(){eyes.style.setProperty('--look-tilt','0deg');pupils.forEach(p=>p.style.transform='translate(0px,0px) scale(1)');}
function look(){
frame=0;
if(!pointer||motion.matches){reset();return;}
const box=eyes.getBoundingClientRect();
if(!visible())return;
const dx=pointer.x-(box.left+box.width/2);
const dy=pointer.y-(box.top+box.height/2);
// Independent axes keep upward/downward gaze clear even near screen corners.
const horizontalRange=Math.min(220,Math.max(110,innerWidth*.32));
const nx=Math.max(-1,Math.min(1,dx/horizontalRange));
const ny=Math.max(-1,Math.min(1,dy/180));
// Rightward glance makes the screen-right eye smaller and the left eye larger.
eyes.style.setProperty('--look-tilt',(-nx*12).toFixed(2)+'deg');
pupils.forEach((p,index)=>{
const scale=1+nx*(index===1?-.18:.18);
// A tilted circular eye projects to a shorter ellipse for either vertical direction.
// Both eyes share the same vertical perspective; only horizontal gaze changes relative size.
const verticalPerspective=1-Math.abs(ny)*.28;
const sx=scale;
const sy=scale*verticalPerspective;
p.style.transform='translate('+(nx*18).toFixed(2)+'px,'+(ny*22).toFixed(2)+'px) scale('+sx.toFixed(3)+','+sy.toFixed(3)+')';
});
}
function schedule(){if(!frame)frame=requestAnimationFrame(look);}
function stopBlink(){
clearTimeout(blinkTimer);clearTimeout(openTimer);
blinkTimer=0;openTimer=0;eyes.classList.remove('blinking','squinting','angry');
}
function planBlink(){
if(blinkTimer||openTimer||motion.matches||document.hidden||!focused||!visible())return;
blinkTimer=setTimeout(()=>{
blinkTimer=0;
if(motion.matches||document.hidden||!focused||!visible())return;
// Blinks are most common; longer expressions appear occasionally.
const choice=Math.random();
const expression=choice<.65?'blinking':choice<.90?'squinting':'angry';
const duration=expression==='blinking'?260:expression==='squinting'?900+Math.random()*700:800+Math.random()*400;
eyes.classList.add(expression);
openTimer=setTimeout(()=>{openTimer=0;eyes.classList.remove('blinking','squinting','angry');planBlink();},duration);
},2500+Math.random()*4000);
}
// Passive touch events continue during native scrolling without blocking the page.
let activeTouch=null,returnTimer=0;
function clearReturn(){clearTimeout(returnTimer);returnTimer=0;}
function updatePointer(x,y){clearReturn();pointer={x,y};schedule();}
function releaseTouch(){
activeTouch=null;clearReturn();
returnTimer=setTimeout(()=>{returnTimer=0;pointer=null;schedule();},1600);
}
function clearTouch(){activeTouch=null;clearReturn();pointer=null;schedule();}
window.addEventListener('pointermove',event=>{
if(event.pointerType==='touch'||activeTouch!==null)return;
updatePointer(event.clientX,event.clientY);
},{passive:true});
document.documentElement.addEventListener('pointerleave',event=>{
if(event.pointerType==='touch'||activeTouch!==null)return;
clearReturn();pointer=null;schedule();
});
window.addEventListener('touchstart',event=>{
if(activeTouch!==null||!event.changedTouches.length)return;
const touch=event.changedTouches[0];activeTouch=touch.identifier;
updatePointer(touch.clientX,touch.clientY);
},{passive:true});
window.addEventListener('touchmove',event=>{
const touch=Array.from(event.touches).find(t=>t.identifier===activeTouch);
if(touch)updatePointer(touch.clientX,touch.clientY);
},{passive:true});
window.addEventListener('touchend',event=>{
if(Array.from(event.changedTouches).some(t=>t.identifier===activeTouch))releaseTouch();
},{passive:true});
window.addEventListener('touchcancel',event=>{
if(Array.from(event.changedTouches).some(t=>t.identifier===activeTouch))clearTouch();
},{passive:true});
window.addEventListener('blur',()=>{focused=false;clearTouch();stopBlink();});
window.addEventListener('focus',()=>{focused=true;planBlink();});
function refresh(){schedule();if(!visible())stopBlink();else planBlink();}
window.addEventListener('resize',refresh);
window.addEventListener('scroll',refresh,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTouch();stopBlink();}else planBlink();});
motion.addEventListener('change',()=>{clearTouch();stopBlink();schedule();planBlink();});
planBlink();
})();
</script>
</body>

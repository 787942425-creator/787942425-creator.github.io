<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="我的画作与插画作品集。浏览作品，查看完整画面，联系创作者。">
<meta name="theme-color" content="#f8f6f4">
<title>我的画作 · 个人作品集</title>
<style>
:root{--paper:#f8f6f4;--ink:#382d2a;--muted:#74645e;--accent:#84495a;--line:#ded5d0}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:90px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;line-height:1.7}
a{color:inherit;text-underline-offset:5px}button{font:inherit;color:inherit;cursor:pointer}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:5px}
.skip{position:fixed;top:-100px;left:16px;background:white;padding:12px;z-index:10}.skip:focus{top:12px}
.wrap{width:min(1120px,calc(100% - 64px));margin-inline:auto}
nav{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{font-weight:700;text-decoration:none;letter-spacing:.12em}
.nav-links{display:flex;gap:28px}.nav-links a{text-decoration:none;font-size:14px}.nav-links a:hover{color:var(--accent)}
.hero{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:64px;padding:64px 0 80px}
h1{font-size:clamp(42px,6vw,76px);font-weight:500;line-height:1.18;letter-spacing:.03em;margin:0 0 24px}
.intro{color:var(--muted);max-width:28em;margin:0 0 32px;font-size:17px}
.cta{display:inline-block;padding:12px 24px;background:var(--ink);color:white;text-decoration:none;border:1px solid var(--ink)}
.hero-art{margin:0;text-align:center}.hero-art img{display:block;width:100%;height:auto;max-height:540px;object-fit:contain}
.hero-art figcaption{margin-top:16px;color:var(--muted);font-size:13px}
section{scroll-margin-top:24px}.section-heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;padding:26px 0;border-top:1px solid var(--line)}
h2{font-size:28px;font-weight:500;margin:0}.hint{color:var(--muted);font-size:14px;margin:0}
.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;padding-bottom:80px}
.work{margin:0;min-width:0}.art-link{display:block;background:#fff;padding:16px;transition:background .2s}
.art-link:hover{background:#eee7e3}.work img{display:block;width:100%;aspect-ratio:4/5;object-fit:contain}
.work figcaption{display:flex;justify-content:space-between;gap:12px;margin-top:15px;font-size:15px}.year{color:var(--muted);font-size:13px}
.contact{padding:36px 0 64px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:32px;align-items:center}
.contact p{margin:12px 0 0;color:var(--muted)}.contact-actions{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.copy{padding:12px 20px;border:1px solid var(--line);background:transparent}.copy:hover{border-color:var(--accent)}
.status{font-size:13px;min-height:1.7em;color:var(--accent)}
footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:13px}
dialog{border:0;padding:60px 24px 24px;background:var(--paper);color:var(--ink);width:min(1000px,94vw);max-height:94vh}
dialog::backdrop{background:rgba(25,18,16,.8)}dialog img{display:block;max-width:100%;max-height:72vh;width:auto;height:auto;margin:auto;object-fit:contain}
.close{position:absolute;right:16px;top:12px;border:1px solid var(--line);background:white;padding:6px 14px}
.dialog-caption{text-align:center;margin:16px 0 0;color:var(--muted)}
@media(max-width:760px){.wrap{width:calc(100% - 36px)}.hero{gap:28px;padding:40px 0 48px}.intro{font-size:15px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 18px;padding-bottom:48px}.contact{align-items:flex-start;flex-direction:column;gap:24px}}
@media(max-width:520px){nav{padding:18px 0}.nav-links{gap:18px}.hero{grid-template-columns:1fr}.hero-art img{max-height:420px}h1{font-size:46px}.section-heading{align-items:flex-start;flex-direction:column;gap:4px}.gallery{grid-template-columns:1fr}.work img{aspect-ratio:auto;max-height:520px}.art-link{padding:12px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}

.pixel-cat{position:fixed;left:0;top:0;width:80px;height:80px;z-index:5;pointer-events:none;image-rendering:pixelated;contain:strict;will-change:transform}
@media(max-width:520px){.pixel-cat{width:64px;height:64px}}
</style>
</head>
<body>
<a class="skip" href="#works">跳到作品</a>
<header class="wrap">
<nav aria-label="主导航"><a class="brand" href="#">我的画作</a><div class="nav-links"><a href="#works">作品</a><a href="#contact">联系</a></div></nav>
<div class="hero">
<div><h1>我的画作</h1><p class="intro">这里收藏我的绘画与插画作品。欢迎慢慢浏览，发现画面里的细节。</p><a class="cta" href="#works">浏览作品</a></div>
<figure class="hero-art"><img src="assets/banner.png" width="2125" height="2716" alt="粉色与棕色纹理的女孩插画" fetchpriority="high"><figcaption>My Art Portfolio</figcaption></figure>
</div>
</header>
<main class="wrap">
<section id="works" aria-labelledby="works-title">
<div class="section-heading"><h2 id="works-title">作品集</h2><p class="hint">点击画作，查看完整大图</p></div>
<div class="gallery">
<figure class="work"><a class="art-link" href="3f48880e3edd73ae4baf8ad29bb51d16.jpg" data-title="作品1 · 2025" aria-label="放大查看作品1"><img src="3f48880e3edd73ae4baf8ad29bb51d16.jpg" alt="作品1" loading="lazy" decoding="async"></a><figcaption><span>作品1</span><span class="year">2025</span></figcaption></figure>
<figure class="work"><a class="art-link" href="eb8fa704f4ba858b381abc25a9b1e10e.jpg" data-title="作品2 · 2025" aria-label="放大查看作品2"><img src="eb8fa704f4ba858b381abc25a9b1e10e.jpg" alt="作品2" loading="lazy" decoding="async"></a><figcaption><span>作品2</span><span class="year">2025</span></figcaption></figure>
<figure class="work"><a class="art-link" href="f118cb28e396485c23c221a8b37be1fe.jpg" data-title="作品3 · 2025" aria-label="放大查看作品3"><img src="f118cb28e396485c23c221a8b37be1fe.jpg" alt="作品3" loading="lazy" decoding="async"></a><figcaption><span>作品3</span><span class="year">2025</span></figcaption></figure>
</div>
</section>
<section id="contact" class="contact" aria-labelledby="contact-title">
<div><h2 id="contact-title">联系我</h2><p>关于画作的交流与合作，欢迎通过微信联系。</p></div>
<div class="contact-actions"><span>微信：<span id="wechat">15336513023</span></span><button class="copy" id="copy-wechat" type="button" hidden>复制微信号</button><span class="status" id="copy-status" role="status"></span></div>
</section>
</main>
<footer><div class="wrap">© 2026 我的画作</div></footer>
<dialog id="viewer" aria-label="作品大图" aria-describedby="viewer-caption"><button class="close" type="button" aria-label="关闭作品大图">关闭</button><img id="viewer-image" alt=""><p class="dialog-caption" id="viewer-caption"></p></dialog>
<canvas id="pixel-cat" class="pixel-cat" width="20" height="20" aria-hidden="true" hidden></canvas>
<script>
const viewer=document.getElementById('viewer');
const image=document.getElementById('viewer-image');
const caption=document.getElementById('viewer-caption');
if(typeof viewer.showModal==='function'){
document.querySelectorAll('.art-link').forEach(link=>link.addEventListener('click',event=>{
if(event.ctrlKey||event.metaKey||event.shiftKey||event.altKey)return;
event.preventDefault();
image.src=link.getAttribute('href');
image.alt=link.querySelector('img').alt;
caption.textContent=link.dataset.title;
viewer.showModal();
}));
viewer.querySelector('.close').addEventListener('click',()=>viewer.close());
viewer.addEventListener('click',event=>{if(event.target===viewer){const r=viewer.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)viewer.close();}});
viewer.addEventListener('close',()=>image.removeAttribute('src'));
}
const copyButton=document.getElementById('copy-wechat');
copyButton.hidden=false;
copyButton.addEventListener('click',async()=>{
const status=document.getElementById('copy-status');
try{await navigator.clipboard.writeText(document.getElementById('wechat').textContent);status.textContent='已复制，可以到微信添加。';}
catch{status.textContent='未能自动复制，请长按或选中上方微信号复制。';}
});

// A small native pixel sprite: no image downloads or animation dependencies.
(()=>{
const cat=document.getElementById('pixel-cat');
const ctx=cat.getContext('2d');
if(!ctx)return;
const palette={o:'#344b75',b:'#79b9ec',s:'#5091ce',l:'#c0e5ff',p:'#efa8bc',w:'#fff9ed',e:'#253952'};
const pixels=[
'....................',
'....oo......oo......',
'...obbo....obbo.....',
'...obpboooobpbo.....',
'...obbbbbbbbbbo.....',
'..obbbbbbbbbbbbo....',
'..obblbbbbblbbbo....',
'..obbewbbbewbbbo....',
'..obppbbpbbppbbo....',
'...obblwllwlbbo.....',
'....oblllllbbo......',
'.....osbbbsbo...oo..',
'....obsbbbsbbo.obbo.',
'....oblllllbbo.obbo.',
'....oblllllbboobbo..',
'....obslllsbbbbo....',
'.....obbbbbboo......',
'.....obbobbbo.......',
'.....ooo.oooo.......',
'....................'];
const motion=matchMedia('(prefers-reduced-motion: reduce)');
let x=24,y=120,tx=x,ty=y,facing=1,frame=0,lastTime=0;
const limit=(v,max)=>Math.max(0,Math.min(v,Math.max(0,max)));
function bounds(){const size=cat.getBoundingClientRect().width;tx=limit(tx,innerWidth-size);ty=limit(ty,innerHeight-size);x=limit(x,innerWidth-size);y=limit(y,innerHeight-size);}
function paint(walking,time){
ctx.clearRect(0,0,20,20);ctx.save();
if(facing<0){ctx.translate(20,0);ctx.scale(-1,1);}
const step=walking?Math.floor(time/130)%2:0;
pixels.forEach((row,py)=>[...row].forEach((color,px)=>{
if(!palette[color])return;
ctx.fillStyle=palette[color];ctx.fillRect(px,py+(py>=17?((px<9?step:-step)):0),1,1);
}));ctx.restore();
}
function place(){cat.style.transform='translate3d('+Math.round(x)+'px,'+Math.round(y)+'px,0)';}
function tick(time){
frame=0;
if(document.hidden||motion.matches)return;
const dt=Math.min((time-lastTime)||16,50);lastTime=time;
const dx=tx-x,dy=ty-y;
const walking=Math.hypot(dx,dy)>1;
if(walking){if(Math.abs(dx)>1)facing=dx<0?-1:1;const amount=1-Math.exp(-dt/110);x+=dx*amount;y+=dy*amount;}
else{x=tx;y=ty;}
place();paint(walking,time);
if(walking)frame=requestAnimationFrame(tick);
}
function start(){if(!frame&&!motion.matches&&!document.hidden){lastTime=0;frame=requestAnimationFrame(tick);}}
window.addEventListener('pointermove',event=>{
if(motion.matches)return;
const size=cat.getBoundingClientRect().width;
// Leave a gap beside the pointer, and stay entirely inside the viewport.
tx=event.clientX+size+18>innerWidth?event.clientX-size-18:event.clientX+18;
ty=event.clientY-size/2;bounds();start();
},{passive:true});
window.addEventListener('resize',()=>{bounds();place();start();});
function stop(){if(frame)cancelAnimationFrame(frame);frame=0;paint(false,0);}
motion.addEventListener('change',()=>{if(motion.matches)stop();else start();});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start();});
bounds();place();paint(false,0);cat.hidden=false;
})();

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的作品集</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #fafafa;
      color: #333;
    }
    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: #fff;
      border-bottom: 1px solid #eee;
    }
    header h1 { margin: 0; font-size: 2.5em; letter-spacing: 2px; }
    header p { margin: 10px 0 0; color: #888; font-size: 1.1em; }
    .gallery {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .gallery img {
      width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      transition: transform 0.3s;
    }
    .gallery img:hover { transform: scale(1.03); }
    .caption {
      text-align: center;
      margin-top: 8px;
      font-size: 0.9em;
      color: #666;
    }
    .item { margin-bottom: 24px; }
    footer {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <header>
    <h1>我的画作</h1>
    <p>My Art Portfolio</p>
  </header>

  <div class="gallery">
    <div class="item">
      <img src="3f48880e3edd73ae4baf8ad29bb51d16.jpg" alt="作品1">
      <div class="caption">作品1 · 2025</div>
    </div>
    <div class="item">
      <img src="eb8fa704f4ba858b381abc25a9b1e10e.jpg" alt="作品2">
      <div class="caption">作品2 · 2025</div>
    </div>
    <div class="item">
      <img src="f118cb28e396485c23c221a8b37be1fe.jpg" alt="作品3">
      <div class="caption">作品3 · 2025</div>
    </div>
  </div>

  <footer>© 2026 我的画作 · 微信：15336513023</footer>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的作品集</title>
<style>
body {
margin: 0;
padding: 0;
font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
background: #fafafa;
color: #333;
}
header {
text-align: center;
padding: 60px 20px 40px;
background: #fff;
border-bottom: 1px solid #eee;
}
header h1 {
margin: 0;
font-size: 2.5em;
letter-spacing: 2px;
}
header p {
margin: 10px 0 0;
color: #888;
font-size: 1.1em;
}
.gallery {
max-width: 1000px;
margin: 40px auto;
padding: 0 20px;
display: grid;
grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
gap: 20px;
}
.gallery img {
width: 100%;
height: auto;
border-radius: 8px;
box-shadow: 0 2px 12px rgba(0,0,0,0.08);
transition: transform 0.3s;
}
.gallery img:hover {
transform: scale(1.03);
}
.gallery .caption {
text-align: center;
margin-top: 8px;
font-size: 0.9em;
color: #666;
}
.item {
margin-bottom: 24px;
}
footer {
text-align: center;
padding: 40px 20px;
color: #999;
font-size: 0.9em;
}
</style>
</head>
<body>

<header>
<h1>我的画作</h1>
<p>My Art Portfolio</p>
</header>

<div class="gallery">

<div class="item">
<img src="你的图片1.jpg" alt="作品1">
<div class="caption">作品名称 · 2025</div>
</div>

<div class="item">
<img src="你的图片2.jpg" alt="作品2">
<div class="caption">作品名称 · 2025</div>
</div>

<div class="item">
<img src="你的图片3.jpg" alt="作品3">
<div class="caption">作品名称 · 2025</div>
</div>

</div>

<footer>
© 2025 你的名字 · 联系方式：your@email.com
</footer>

</body>
</html>
